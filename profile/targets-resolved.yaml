# Resolved career-page URLs for the target universe in profile/targets.md.
# Written by the sourcing sweep. FREE path per PROMPT-POLICY.md.
# First resolved: 2026-09-28. Update `checked` when a sweep re-verifies an entry.
#
# status values:
#   ok             - board loads and can be enumerated by fetching
#   js_only        - board renders client-side; a fetcher sees nothing. Needs a browser pass.
#   robots_blocked - robots.txt or the egress proxy refuses. Needs a browser pass.
#   no_board       - firm has no public vacancy list (speculative applications only)
#   defunct        - firm no longer exists under this name / absorbed elsewhere
#   unresolved     - could not identify the firm or its careers page

