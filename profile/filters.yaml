# Scoring and filter rules for the weekly sweep (v2).
# Source: CLAUDE.md §3 (scoping interview 2026-10-09). Change rules HERE, not in prompts.
# If this file and prompts/sweep.md disagree, this file wins and the sweep says so.
# Last reviewed: 2026-10-09

# ── Scope ────────────────────────────────────────────────────────────────────
# Five role families, weighted equally. A posting outside all five is DROPPED (not flagged).
families:
  mgmt:      "generalist management / business consulting (strategy, commercial, pricing,
              operations, public-sector consulting). Mid-size firms and boutiques welcome."
  energy:    "energy / climate / energy-transition consulting or analysis"
  econ:      "economic consulting (competition, regulatory, damages, economic impact)"
  policy:    "think tanks, EU institutions, international organisations, central banks, regulators"
  analytics: "data / analytics / economist roles in industry"

out_of_scope:   # drop silently, but count in the sweep summary
  - marketing, brand, social media, community management
  - sales, business development, account management
  - product management (in-house)
  - pure software / data engineering, IT implementation (SAP, ERP, cyber)
  - audit, tax compliance, accounting
  - internships, working-student and thesis placements
  - PhD studentships, postdocs, professorships
  - senior roles: senior manager, principal, partner, director, head of, lead (> ~5 years)

# ── Score = role fit (0–5) + location (0–3) + network (0–2) = 0–10 ───────────
# Role fit dominates by design. Always write:
#   breakdown: "role X/5 + location Y/3 + network Z/2 = N"
# and store role fit in `fit`, the total in `score`.
role_fit:
  family: 2              # in one of the five families (else the row doesn't exist)
  seniority:             # 0–2
    2: "entry level to ~3 years required (he'll have ~2 years by Feb 2027)"
    1: "3–5 years asked, or 'senior analyst' that reads as a stretch"
    0: "cohort-gated graduate scheme for current students (e.g. '2027 BSc graduates'),
        or prerequisite experience he doesn't have (valuation, audit, IB, Big-4)"
  client_facing: 1       # +1 if client-facing / business-consulting flavoured

location:                # 0–3; use the role's location, or the best office when the applicant picks
  3: [Italy]             # Southern Italy (Campania, Puglia, Basilicata, Calabria, Sicily,
                         # Sardinia, Molise, Abruzzo) also sets `south: true`; ranks above all else
  2: [UK, Nordics, Spain, France]
  1: [Germany]
  0: "anywhere else; also set `offList: true` (shown, rarely worth it)"
  notes:
    - "Nordics = Denmark, Sweden, Norway, Finland, Iceland."
    - "Brussels, Luxembourg, Amsterdam, Vienna, Zurich = 0 + offList under the current rule."
    - "Remote roles: score the employer's contracting country."
    - "Multi-office postings: score the best office he could choose, and name it in `why`."

visa:
  uk: true               # UK roles set `visa: true` (Skilled Worker sponsorship needed)
  exceptions:
    - "International organisations that handle staff immigration themselves (EBRD) → visa: false"

network:                 # 0–2; match against the dashboard `contacts` collection
  2: "an inner-circle contact works at the employer"
  1: "area link: a contact who can speak to the city or sector
      (e.g. Leonardo Sala → Brussels / policy, Prof. Arlt → energy economics)"
  0: "none"
  on_hold: "contacts with hold: true still count for the score; the dashboard shows them as on hold"
  record: "put matched contact ids in `contactIds`"

# ── Flags (shown on the card, never exclusions) ──────────────────────────────
german:
  required:   "posting states German at good/fluent/business/C1 level (Deutsch, verhandlungssicher,
               fließend, 'very good written and spoken'). Set german: \"required\". Do NOT exclude."
  unverified: "requirements can't be read (JD in a PDF that won't open, JS-only body). german: \"unverified\""
  none:       "German absent or only 'a plus' / 'advantageous' → german: \"\""
  # He has B1, B2 in progress. Since FB-1 (archive/feedback/2026-09-27.md): a preference is not
  # a requirement, and he decides on requirements, not the sweep.

other_languages: "French / Spanish / Dutch etc. required at working level → say so in `why`
                  (e.g. 'French fluency required'). No score change, no exclusion."

eligibility: "cohort gates, degree class, right-to-work / 'no visa sponsorship', 'N+ years in a
              technical role': KEEP THE ROW. Score seniority 0 where §role_fit says so and state the
              gate in `why` (e.g. 'States no UK sponsorship', '1+ yrs technical required') so the
              card shows what's being overridden. He decides, not the sweep."
legal_bar: "the only eligibility drop: a role legally reserved for a category he isn't in (e.g.
            Italy's L. 68/99 protected categories, a nationality-restricted civil-service post).
            Drop it and name it in the summary."

# ── Culture: his gut call ────────────────────────────────────────────────────
tone: "1–2 VERBATIM sentences from the posting or the firm's careers page showing how the firm
       talks about its people (flexibility, team, hours, development). Quote, don't paraphrase.
       If nothing exists, write \"\" and say 'no tone text found' in `why`."

# ── Link hygiene (v1 lessons, archive/feedback/2026-09-27.md) ────────────────
links:
  - "The URL resolves to the posting itself, not a careers homepage, search page or programme hub."
  - "It is still accepting applications (no 'position filled', no passed deadline)."
  - "Record the direct application URL, or drop the row."
  - "Fetch the exact string you write. Keep required quirks (?persisted_lang=en, ?in_iframe=1)."
  - "403 / JS-only: confirm from the employer's own board before keeping it; say how in `why`."
  - "Read language, cohort and experience requirements BEFORE adding the row."

# ── Housekeeping ─────────────────────────────────────────────────────────────
dedupe: "match on URL first, then employer + role (case-insensitive, ignore (m/f/d) suffixes)"
expire: "status → expired when the link is dead, redirects to a landing page, or the deadline passed"
cap:    25   # max new rows per sweep, highest score first; report how many were cut
recalibrate: "once 10+ rows have status 'no', tally noReason and propose (not apply) scoring changes"
