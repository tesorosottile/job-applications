# Filter rules for the sourcing sweep.
# Change rules HERE, not in prompts. Every scheduled task reads this file.
# Last reviewed: 2026-09-12

freshness:
  # Keep any posting first seen, reposted or reshared within this window.
  window_days: 14
  # Never delete rows. Postings that age out move to status = expired.
  retain_expired: true

geography:
  germany:      { action: include, priority: normal }
  eu_eea:       { action: include, priority: normal }   # Italian citizen, no permit needed
  switzerland:  { action: include, priority: normal }   # free movement; note non-EU tax/admin
  uk:
    action: include
    flag: sponsorship_required        # Skilled Worker visa; many firms do not sponsor at analyst level
    priority_boost_if: fit_score >= 8
  us:
    action: exclude
    exception: fully_remote_explicit  # must say remote AND not require US work authorisation
    note: >
      Expect very few genuine hits. Do not let this bucket consume review attention.
  rest_of_world: { action: exclude }

language:
  business_german_required: exclude       # revisit at B2 — change this line only
  german_soft_or_plus:      include
  english_working_language: include
  # When German is listed as "nice to have", flag it so the letter can pre-empt it.
  flag_soft_german: true

seniority:
  include: [analyst, associate, consultant, junior consultant, research analyst,
            economist, graduate programme, entry level, 0-3 years]
  exclude: [senior manager, principal, partner, director, head of, lead,
            internship, working student, thesis placement]
  max_years_required: 3
  note: Postings asking 2-3 years are still in scope; I have ~2 by Feb 2027.

role_types:
  include: [economic consulting, management consulting, strategy consulting,
            policy analysis, competition economics, regulatory economics,
            data/analytics consulting, research economist]
  exclude: [marketing, brand, social media, community management, product management,
            sales, business development, pure software engineering, capture/creative]

fit_score:
  # 0-10. The sweep must show its arithmetic per posting.
  quantitative_content:     3   # econometrics, causal inference, modelling explicitly wanted
  consulting_client_facing: 2
  sector_match:             2   # energy/utilities, labour/migration, competition, public policy
  seniority_match:          2
  language_and_location:    1
  triage:
    "8-10": auto-shortlist, draft in next batch
    "5-7":  shortlist for manual review
    "0-4":  log only, do not surface

deduplication:
  key: [employer, role_title, location]
  # Same role reposted = update last_seen, do not create a new row.

caps:
  max_new_rows_surfaced_per_sweep: 25   # protects review time, not credits
